services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: asahi-app
    environment:
      APP_HOST: asahi.test
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: asahi-web
    ports:
      - "80:80"      # http://asahi.test
      - "8000:80"    # http://localhost:8000 (untuk Google OAuth)
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      default:
        aliases:
          - asahi.test

  db:
    image: mysql:8.0
    container_name: asahi-db
    environment:
      MYSQL_DATABASE: asahi
      MYSQL_USER: asahi
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-uasahi"]
      interval: 5s
      retries: 20

volumes:
  dbdata:
